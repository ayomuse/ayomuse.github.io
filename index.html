<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muse Prompt Generator</title>
    <style>
        /* Desain Minimalis & Premium */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap');

        :root {
            --bg-color: #F7F7F8;
            --surface: #FFFFFF;
            --text-main: #111111;
            --text-muted: #666666;
            --border: #E5E5E5;
            --accent: #000000;
            --accent-hover: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Container Utama (Split Layout) */
        .container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 1100px;
            width: 100%;
        }

        @media (min-width: 900px) {
            .container {
                flex-direction: row;
                align-items: center;
                gap: 60px;
            }
        }

        /* Sisi Kiri: Gambar */
        .image-section {
            flex: 1;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.08);
            background-color: var(--surface);
            aspect-ratio: 4/5;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .image-section:hover img {
            transform: scale(1.03);
        }

        .upload-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .upload-overlay:hover {
            background: rgba(255, 255, 255, 1);
        }

        .upload-overlay input[type="file"] {
            display: none;
        }

        /* Sisi Kanan: Konten & Prompt */
        .content-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .badge {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--text-muted);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8em;
            line-height: 1.1;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Pengaturan Minimalis */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .setting-item label {
            display: block;
            font-size: 0.8em;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            color: var(--text-main);
            appearance: none;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent);
        }

        /* Kotak Prompt */
        .prompt-box {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
        }

        .prompt-text {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.95em;
            line-height: 1.6;
            color: var(--text-main);
            white-space: pre-wrap;
        }

        /* Tombol Copy */
        .btn-copy {
            margin-top: 20px;
            width: 100%;
            padding: 16px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-copy:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-copy:active {
            transform: translateY(0);
        }

        .btn-copy.copied {
            background-color: #10B981; /* Green color for success */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sisi Kiri: Visual -->
        <div class="image-section">
            <!-- Gambar default (bisa diganti dengan gambar Muse Anda) -->
            <img id="display-image" src="https://images.unsplash.com/photo-1584916201218-f4242ceb4809?q=80&w=800&auto=format&fit=crop" alt="Product Reference">
            
            <!-- Area Upload User -->
            <label class="upload-overlay" for="image-upload">
                📸 Klik untuk gunakan foto produk Anda
                <input type="file" id="image-upload" accept="image/*" onchange="previewImage(event)">
            </label>
        </div>

        <!-- Sisi Kanan: Teks & Kontrol -->
        <div class="content-section">
            <div>
                <span class="badge">Product Photography</span>
                <h1 style="margin-top: 8px;">Luxury Leather Bag</h1>
            </div>

            <!-- Pengaturan Sederhana -->
            <div class="settings-grid">
                <div class="setting-item">
                    <label>Gerakan Kamera</label>
                    <select id="select-camera" onchange="updatePrompt()">
                        <option value="a slow panning shot">Slow Panning</option>
                        <option value="a 360-degree orbit">Orbit 360 Derajat</option>
                        <option value="a cinematic dolly track">Cinematic Dolly</option>
                        <option value="a macro close-up">Macro Close-up</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Pencahayaan</label>
                    <select id="select-lighting" onchange="updatePrompt()">
                        <option value="studio lighting with soft shadows">Studio Soft</option>
                        <option value="warm golden hour sunlight">Golden Hour</option>
                        <option value="neon cyberpunk lighting">Neon Cyberpunk</option>
                        <option value="dramatic chiaroscuro lighting">Dramatis</option>
                    </select>
                </div>
            </div>

            <!-- Area Prompt -->
            <div class="prompt-box">
                <div class="prompt-text" id="final-prompt">
                    Memuat prompt...
                </div>
                <button class="btn-copy" onclick="copyPrompt()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy Prompt
                </button>
            </div>
        </div>
    </div>

    <script>
        // Template Prompt Dasar (Ganti sesuai kebutuhan Anda)
        const basePrompt = "Create this image into a high-end commercial video of a luxury leather bag. The bag is [ACTION], captured with [CAMERA] using [LIGHTING]. Ultra-realistic, 8k resolution, fashion campaign style.";
        
        // Opsi Aksi (bisa Anda tambah atau ubah)
        const actionText = "floating gracefully in mid-air";

        function updatePrompt() {
            const camera = document.getElementById('select-camera').value;
            const lighting = document.getElementById('select-lighting').value;

            // Mengganti placeholder dengan pilihan user
            let generatedPrompt = basePrompt
                .replace('[CAMERA]', camera)
                .replace('[LIGHTING]', lighting)
                .replace('[ACTION]', actionText);

            document.getElementById('final-prompt').innerText = generatedPrompt;
        }

        // Fitur Preview Gambar User
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('display-image').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        // Fitur Copy
        function copyPrompt() {
            const textToCopy = document.getElementById('final-prompt').innerText;
            const btn = document.querySelector('.btn-copy');
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                // Animasi sukses
                btn.classList.add('copied');
                btn.innerHTML = `✅ Berhasil Dicopy!`;
                
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Prompt`;
                }, 2000);
            });
        }

        // Jalankan saat halaman dimuat
        updatePrompt();
    </script>
</body>
</html>
