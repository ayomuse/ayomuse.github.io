<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muse Premium Prompts - Members Area</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap');

        :root {
            --bg-color: #FAFAFA;
            --surface: #FFFFFF;
            --text-main: #111111;
            --text-muted: #666666;
            --border: #E5E5E5;
            --accent: #000000;
            --code-bg: #F4F4F5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HERO SECTION (Rata Tengah) --- */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-badge {
            display: inline-block;
            background: #E8F5E9; /* Warna hijau lembut untuk sukses/beli */
            color: #2E7D32;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8em;
            line-height: 1.2;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .hero p {
            font-size: 1.1em;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- GALLERY GRID (Kolom) --- */
        .gallery-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 80px;
            display: grid;
            grid-template-columns: 1fr; /* Mobile: 1 Kolom */
            gap: 30px;
        }

        @media (min-width: 768px) {
            .gallery-container {
                grid-template-columns: repeat(2, 1fr); /* Tablet: 2 Kolom */
            }
        }

        @media (min-width: 1024px) {
            .gallery-container {
                grid-template-columns: repeat(3, 1fr); /* Desktop: 3 Kolom */
            }
        }

        /* Kartu Konten */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        /* Video Player */
        .video-container {
            width: 100%;
            position: relative;
            background: #000;
            aspect-ratio: 16/9; /* Standar video landscape */
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .card-header {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-category {
            font-size: 0.75em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Kotak Prompt */
        .prompt-box {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .prompt-text {
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.85em;
            line-height: 1.5;
            color: #333;
            margin-bottom: 16px;
            flex: 1;
        }

        /* Tombol Salin */
        .btn-copy {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-copy:hover { background: #333; }
        .btn-copy.copied { background: #10B981; } /* Warna hijau saat berhasil */
    </style>
</head>
<body>

    <!-- HERO SECTION -->
    <header class="hero">
        <span class="hero-badge">Thanks for your purchase</span>
        <h1>Premium Muse Video Prompts</h1>
        <p>Terima kasih telah berlangganan. Di bawah ini adalah kumpulan prompt eksklusif yang sudah teruji. Silakan salin kode dan gunakan di akun Muse AI Anda.</p>
    </header>

    <!-- GRID KONTEN -->
    <main class="gallery-container" id="gallery-container">
        <!-- Kartu akan diisi oleh JavaScript -->
    </main>

    <script>
        // DATA PROMPT & VIDEO
        // GANTI 'videoUrl' dengan link video MP4 Anda, dan 'poster' dengan gambar thumbnail video
        const promptsData = [
            {
                id: 1,
                title: "Luxury Bag Showcase",
                category: "Fashion & Apparel",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4", // GANTI DENGAN LINK VIDEO ANDA
                poster: "https://images.unsplash.com/photo-1584916201218-f4242ceb4809?q=80&w=800&auto=format&fit=crop", // GANTI DENGAN THUMBNAIL VIDEO
                prompt: "Create this image into a high-end commercial video of a luxury leather bag. The bag is floating gracefully in mid-air, captured with a slow panning shot using studio lighting with soft shadows. Ultra-realistic, 8k resolution, fashion campaign style."
            },
            {
                id: 2,
                title: "Sneaker Unboxing POV",
                category: "Unboxing",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4", // GANTI DENGAN LINK VIDEO ANDA
                poster: "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=800&auto=format&fit=crop",
                prompt: "Create this image into a POV unboxing video. First-person perspective hands opening a premium box revealing modern sneakers. The sneakers are slowly rising from the box, cinematic dolly track, warm golden hour sunlight. Crisp details, ASMR aesthetic."
            },
            {
                id: 3,
                title: "Elegant Watch Macro",
                category: "Cinematic Detail",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4", // GANTI DENGAN LINK VIDEO ANDA
                poster: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=800&auto=format&fit=crop",
                prompt: "Create this image into a cinematic macro video of an elegant watch. The subject is rotating slowly to catch the light, captured with a macro close-up and dramatic chiaroscuro lighting. Shallow depth of field, photorealistic, anamorphic lens flare."
            },
            {
                id: 4,
                title: "Tech Gadget Dynamic",
                category: "Technology",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4", // GANTI DENGAN LINK VIDEO ANDA
                poster: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=800&auto=format&fit=crop",
                prompt: "Create this image into a dynamic tech commercial. The smartphone is exploding into pieces and reassembling, shot with a 360-degree orbit under neon cyberpunk lighting. Futuristic vibe, glowing accents, 4k."
            },
            {
                id: 5,
                title: "Cosmetic Bottle Glow",
                category: "Beauty & Skincare",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4", // GANTI DENGAN LINK VIDEO ANDA
                poster: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?q=80&w=800&auto=format&fit=crop",
                prompt: "Create this image into a luxurious beauty commercial. A cosmetic bottle is surrounded by floating water droplets, shot with a slow panning shot using studio lighting with soft shadows. Dewy skin texture, glowing particles, 8k."
            }
        ];

        const galleryContainer = document.getElementById('gallery-container');

        // FUNGSI RENDER KARTU
        function renderGallery() {
            galleryContainer.innerHTML = '';
            
            promptsData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="video-container">
                        <!-- Tag video tanpa autoplay, menggunakan poster/thumbnail -->
                        <video src="${item.videoUrl}" poster="${item.poster}" controls preload="none"></video>
                    </div>
                    <div class="card-body">
                        <div class="card-header">
                            <span class="card-category">${item.category}</span>
                            <div class="card-title">${item.title}</div>
                        </div>
                        <div class="prompt-box">
                            <div class="prompt-text" id="prompt-${item.id}">${item.prompt}</div>
                            <button class="btn-copy" onclick="copyText(${item.id}, this)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                Salin Prompt
                            </button>
                        </div>
                    </div>
                `;
                
                galleryContainer.appendChild(card);
            });
        }

        // FUNGSI SALIN TEKS
        function copyText(id, btnElement) {
            // Ambil teks berdasarkan ID unik dari prompt
            const textToCopy = document.getElementById(`prompt-${id}`).innerText;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                // Simpan teks asli tombol
                const originalHTML = btnElement.innerHTML;
                
                // Ubah status tombol
                btnElement.classList.add('copied');
                btnElement.innerHTML = '✅ Berhasil Disalin!';
                
                // Kembalikan ke bentuk semula setelah 2 detik
                setTimeout(() => {
                    btnElement.classList.remove('copied');
                    btnElement.innerHTML = originalHTML;
                }, 2000);
            }).catch(err => {
                alert('Gagal menyalin teks. Silakan salin secara manual.');
            });
        }

        // Jalankan render saat halaman dimuat
        renderGallery();
    </script>
</body>
</html>
